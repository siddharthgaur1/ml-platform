apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fraud-scorer.fullname" . }}
  labels: {{- include "fraud-scorer.labels" . | nindent 4 }}
data:
  REDIS_URL: {{ .Values.backends.redisUrl | quote }}
  POSTGRES_DSN: {{ .Values.backends.postgresDsn | quote }}
  MODEL_DIR: {{ .Values.backends.modelDir | quote }}
  REPORTS_DIR: {{ .Values.backends.reportsDir | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  KAFKA_TOPIC: {{ .Values.kafka.topic | quote }}
  RATE_LIMIT_PER_MIN: {{ .Values.scoring.rateLimitPerMin | quote }}
  MODEL_BATCH_MAX: {{ .Values.scoring.modelBatchMax | quote }}
  MODEL_BATCH_WAIT_MS: {{ .Values.scoring.modelBatchWaitMs | quote }}
  DB_WRITE_BATCH: {{ .Values.scoring.dbWriteBatch | quote }}
  DB_WRITE_QUEUE_MAX: {{ .Values.scoring.dbWriteQueueMax | quote }}
