{{- include "fraud-scorer.validateAuth" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fraud-scorer.fullname" . }}
  labels: {{- include "fraud-scorer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "fraud-scorer.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Model load takes seconds, so surging by one and never going below the
      # desired count keeps capacity flat through a rollout.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: {{- include "fraud-scorer.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when config or keys change. Without this a `helm upgrade`
        # that only touches the ConfigMap leaves every pod running the old values.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.auth.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fraud-scorer.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The batcher and the DB writer both flush on shutdown (api/main.py
      # lifespan). This gives them room to; the default 30s is enough for the
      # write queue to drain but leaves no margin under load.
      terminationGracePeriodSeconds: 45
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels: {{- include "fraud-scorer.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: scorer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - ml_platform.fraud.api.main:app
            - --host=0.0.0.0
            - --port={{ .Values.service.port }}
            - --workers={{ .Values.workers }}
            - --limit-concurrency={{ .Values.limitConcurrency }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "fraud-scorer.fullname" . }}
          env:
            {{- if .Values.auth.allowUnauthenticated }}
            - name: ALLOW_UNAUTHENTICATED
              value: "true"
            {{- else }}
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "fraud-scorer.secretName" . }}
                  key: api-keys
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything the process writes needs
            # an explicit mount. /reports is where the monitor drops HTML/JSON;
            # /tmp is needed by libraries that spill to disk.
            - name: reports
              mountPath: {{ .Values.backends.reportsDir }}
            - name: tmp
              mountPath: /tmp
      volumes:
        # emptyDir, not a PVC: reports are regenerated each cycle and a pod that
        # loses them is not degraded. The model is baked into the image
        # (deploy/fraud/Dockerfile, runtime-with-model target).
        - name: reports
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
