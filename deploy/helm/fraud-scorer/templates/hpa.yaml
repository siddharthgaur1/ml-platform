{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fraud-scorer.fullname" . }}
  labels: {{- include "fraud-scorer.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fraud-scorer.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # CPU, not requests-per-second. Scoring is CPU-bound by construction, so CPU
    # tracks the real constraint closely, and it needs only metrics-server.
    # Scaling on fraud_score_requests_total would need prometheus-adapter -- a
    # large amount of moving parts for a signal that is nearly collinear here.
    # See deploy/helm/README.md if you want it anyway.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- with .Values.autoscaling.behavior }}
  behavior: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
