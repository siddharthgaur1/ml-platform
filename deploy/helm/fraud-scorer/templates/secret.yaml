{{- if and (not .Values.auth.existingSecret) (not .Values.auth.allowUnauthenticated) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fraud-scorer.fullname" . }}
  labels: {{- include "fraud-scorer.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Values-supplied keys land in the release manifest, which is readable by
  # anyone with get access to secrets in this namespace. For anything real, use
  # auth.existingSecret and a secrets manager.
  api-keys: {{ .Values.auth.apiKeys | quote }}
{{- end }}
