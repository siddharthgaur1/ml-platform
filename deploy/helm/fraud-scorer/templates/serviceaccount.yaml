{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fraud-scorer.serviceAccountName" . }}
  labels: {{- include "fraud-scorer.labels" . | nindent 4 }}
# The scorer calls no Kubernetes API, so it has no use for a mounted token.
automountServiceAccountToken: false
{{- end }}
