# Three nodes, not one: with a single node the topology spread constraint and the
# PodDisruptionBudget are both trivially satisfied, so a local run would prove
# nothing about either. Two workers also make HPA scale-up visibly land on
# different nodes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ml-platform
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Lets an Ingress controller bind :80/:443 on this node if one is added
      # later; harmless without it.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
  - role: worker
